<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>body{font:17px system-ui;margin:0;padding:16px;max-width:520px;margin:auto;background:#fafafa}input,button,select{font-size:17px;width:100%;margin:6px 0;padding:8px}.c{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0002}b{color:#2563eb}</style><title>Semantic layer</title></head><body><h2>Why "revenue" needs a definition</h2><p>Same orders, three naive answers. A semantic layer pins one definition.</p>
<select id=d><option value=g>Agent guess A: sum all amounts</option><option value=n>Agent guess B: minus refunds</option><option value=s>Semantic layer: paid, minus refunds, excl. tax</option></select><div class=c id=o></div><div class=c id=t></div>
<script>const O=[{a:120,tax:10,st:'paid'},{a:80,tax:6,st:'refunded'},{a:200,tax:16,st:'paid'},{a:50,tax:4,st:'pending'}];
t.innerHTML='<b>Orders</b><br>'+O.map(o=>'$'+o.a+' (tax '+o.tax+') '+o.st).join('<br>');
function f(){let v=d.value,r=v=='g'?O.reduce((s,o)=>s+o.a,0):v=='n'?O.filter(o=>o.st!='refunded').reduce((s,o)=>s+o.a,0):O.filter(o=>o.st=='paid').reduce((s,o)=>s+o.a-o.tax,0);o.innerHTML='Revenue = <b>$'+r+'</b>'+(v=='s'?'<br>metric: revenue = sum(amount−tax) where status=paid':'<br>⚠️ confident, but which definition?')}d.onchange=f;f()</script></body></html>
