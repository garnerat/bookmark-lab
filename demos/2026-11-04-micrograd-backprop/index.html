<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>body{font:17px system-ui;margin:0;padding:16px;max-width:520px;margin:auto;background:#fafafa}input,button,select{font-size:17px;width:100%;margin:6px 0;padding:8px}.c{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0002}b{color:#2563eb}</style><title>Backprop</title></head><body><h2>Backprop in one neuron</h2><p>y = tanh(w·x + b). Drag sliders; see gradients (how much each knob moves the loss).</p>
<div class=c>x <input type=range id=x min=-2 max=2 step=.1 value=1>w <input type=range id=w min=-2 max=2 step=.1 value=.5>b <input type=range id=b min=-2 max=2 step=.1 value=0>target <input type=range id=t min=-1 max=1 step=.1 value=.8></div>
<div class=c id=o></div><button onclick=step()>Take a gradient step (lr 0.5)</button>
<script>const g=i=>+document.getElementById(i).value;function calc(){let x=g('x'),w=g('w'),b=g('b'),t=g('t'),z=w*x+b,y=Math.tanh(z),L=(y-t)**2,dy=2*(y-t),dz=dy*(1-y*y);return{x,w,b,y,L,dw:dz*x,db:dz}}
function show(){let r=calc();o.innerHTML='y = <b>'+r.y.toFixed(3)+'</b><br>loss = <b>'+r.L.toFixed(4)+'</b><br>dL/dw = '+r.dw.toFixed(3)+'<br>dL/db = '+r.db.toFixed(3)+'<p>Chain rule: dL/dw = 2(y−t) · (1−y²) · x</p>'}
function step(){let r=calc();w.value=r.w-.5*r.dw;b.value=r.b-.5*r.db;show()}document.querySelectorAll('input').forEach(i=>i.oninput=show);show()</script></body></html>
