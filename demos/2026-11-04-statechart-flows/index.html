<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>body{font:17px system-ui;margin:0;padding:16px;max-width:520px;margin:auto;background:#fafafa}input,button,select{font-size:17px;width:100%;margin:6px 0;padding:8px}.c{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0002}b{color:#2563eb}</style><title>Statechart</title></head><body><h2>A pick's life as a statechart</h2><p>Only allowed transitions show as buttons. Impossible states can't happen.</p><div class=c>State: <b id=s></b></div><div id=bt></div><div class=c id=log></div>
<script>const M={'pending-reply':{reply_build:'build',reply_read:'read only',reply_park:'parked',reply_skip:'skipped',no_reply_14d:'skipped'},parked:{'30_days_pass':'pending-reply'},build:{give_up:'dropped',ship:'published'},'read only':{},skipped:{},dropped:{},published:{}};let st='pending-reply';
function r(){s.textContent=st;bt.innerHTML='';let e=Object.entries(M[st]);if(!e.length)bt.innerHTML='<p>Final state ✅</p>';e.forEach(([ev,to])=>{let b=document.createElement('button');b.textContent=ev+' → '+to;b.onclick=()=>{log.innerHTML+=st+' —'+ev+'→ '+to+'<br>';st=to;r()};bt.append(b)})}
let x=document.createElement('button');x.textContent='Reset';x.onclick=()=>{st='pending-reply';log.innerHTML='';r()};document.body.append(x);r()</script></body></html>
