<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>body{font:17px system-ui;margin:0;padding:16px;max-width:520px;margin:auto;background:#fafafa}input,button,select{font-size:17px;width:100%;margin:6px 0;padding:8px}.c{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0002}b{color:#2563eb}</style><title>CRAP score</title></head><body><h2>CRAP score</h2><p>CRAP = comp² × (1 − cov)³ + comp. Above ~30 = risky to change.</p>
<div class=c>Cyclomatic complexity <span id=cv></span><input type=range id=c min=1 max=30 value=8>Test coverage <span id=pv></span>%<input type=range id=p min=0 max=100 value=20></div><div class=c id=o></div>
<p>Try: complexity 15 with 0% coverage, then raise coverage. Tests beat refactoring until coverage is high.</p>
<script>function s(){let c=+document.getElementById('c').value,p=+document.getElementById('p').value/100,v=c*c*(1-p)**3+c;cv.textContent=c;pv.textContent=Math.round(p*100);o.innerHTML='CRAP = <b>'+v.toFixed(1)+'</b> '+(v>30?'🔴 risky':'🟢 ok')}document.querySelectorAll('input').forEach(i=>i.oninput=s);s()</script></body></html>
