<p class="note">The source of this page is <a href="./WALKTHROUGH.md">WALKTHROUGH.md</a>. Charts and the text report are in <a href="./outputs/REPORT.txt">outputs/</a>.</p>
<article id="doc">Loading the walkthrough…</article>
<noscript><p>This page renders <a href="./WALKTHROUGH.md">WALKTHROUGH.md</a> in the browser. Open that file, or the <a href="https://github.com/garnerat/bookmark-lab/blob/main/walkthroughs/search-result-judge/WALKTHROUGH.md">copy on GitHub</a>.</p></noscript>
<script>
function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(text) {
  var out = escapeHtml(text);
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">');
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return out;
}
function render(md) {
  var lines = md.replace(/\r\n/g, "\n").split("\n");
  var html = [];
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (line.trim() === "") { i += 1; continue; }
    if (line.startsWith("```")) {
      var buf = [];
      i += 1;
      while (i < lines.length && !lines[i].startsWith("```")) { buf.push(lines[i]); i += 1; }
      html.push("<pre><code>" + escapeHtml(buf.join("\n")) + "</code></pre>");
      i += 1;
      continue;
    }
    if (line.startsWith("|")) {
      var rows = [];
      while (i < lines.length && lines[i].startsWith("|")) { rows.push(lines[i]); i += 1; }
      var cells = rows.map(function (row) {
        return row.split("|").slice(1, -1).map(function (cell) { return cell.trim(); });
      }).filter(function (row) { return !row.every(function (cell) { return /^[-: ]+$/.test(cell); }); });
      if (!cells.length) continue;
      var table = "<table><thead><tr>" + cells[0].map(function (cell) { return "<th>" + inline(cell) + "</th>"; }).join("") + "</tr></thead><tbody>";
      cells.slice(1).forEach(function (row) {
        table += "<tr>" + row.map(function (cell) { return "<td>" + inline(cell) + "</td>"; }).join("") + "</tr>";
      });
      html.push(table + "</tbody></table>");
      continue;
    }
    var heading = /^(#{1,3}) /.exec(line);
    if (heading) {
      var level = heading[1].length;
      html.push("<h" + level + ">" + inline(line.slice(level + 1)) + "</h" + level + ">");
      i += 1;
      continue;
    }
    if (line.startsWith("> ")) {
      var quote = [];
      while (i < lines.length && lines[i].startsWith("> ")) { quote.push(lines[i].slice(2)); i += 1; }
      html.push("<blockquote><p>" + quote.map(inline).join("<br>") + "</p></blockquote>");
      continue;
    }
    if (/^[-*] /.test(line)) {
      var items = [];
      while (i < lines.length && /^[-*] /.test(lines[i])) { items.push(lines[i].slice(2)); i += 1; }
      html.push("<ul>" + items.map(function (item) { return "<li>" + inline(item) + "</li>"; }).join("") + "</ul>");
      continue;
    }
    if (/^\d+\. /.test(line)) {
      var steps = [];
      while (i < lines.length && /^\d+\. /.test(lines[i])) { steps.push(lines[i].replace(/^\d+\. /, "")); i += 1; }
      html.push("<ol>" + steps.map(function (item) { return "<li>" + inline(item) + "</li>"; }).join("") + "</ol>");
      continue;
    }
    var para = [];
    while (i < lines.length && lines[i].trim() !== "" && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith("|") && !lines[i].startsWith("> ") && !/^[-*] /.test(lines[i]) && !/^\d+\. /.test(lines[i])) {
      para.push(lines[i]);
      i += 1;
    }
    html.push("<p>" + inline(para.join(" ")) + "</p>");
  }
  return html.join("\n");
}
fetch("./WALKTHROUGH.md")
  .then(function (response) { if (!response.ok) throw new Error(String(response.status)); return response.text(); })
  .then(function (text) { document.getElementById("doc").innerHTML = render(text); })
  .catch(function () {
    document.getElementById("doc").innerHTML = "<p>The walkthrough file did not load. Open <a href='./WALKTHROUGH.md'>WALKTHROUGH.md</a>.</p>";
  });
</script>
</body>
</html>
